<div class="flex flex-col gap-3" data-inference-throttle-control>
    <div class="flex flex-wrap items-center justify-between gap-3">
        <span class="text-xs font-bold tracking-wide text-neutral-700"
              x-text="inferenceThrottleStatus()">FULL THROTTLE • MAXIMUM POWER</span>
        <span x-show="inferenceThrottleSaveStatus()" x-cloak
              x-text="inferenceThrottleSaveStatus()" class="text-xs text-neutral-400"></span>
        <label class="flex items-center gap-2 text-xs text-neutral-500">
            <span>{{ t('settings.inference_throttle.numeric_label') }}</span>
            <input type="number" min="10" max="100" step="any"
                   :value="inferenceThrottleNumericDraft"
                   @input="stageInferenceThrottleNumeric($event.target.value)"
                   @keydown.enter.prevent="commitInferenceThrottleNumeric($event.target.value)"
                   @blur="commitInferenceThrottleNumeric($event.target.value)"
                   :aria-label="window.t('settings.inference_throttle.numeric_label')"
                   class="w-20 rounded-lg border border-neutral-200 px-2 py-1.5 text-right text-sm tabular-nums focus:border-neutral-400 focus:outline-none focus:ring-2 focus:ring-neutral-900">
            <span>%</span>
        </label>
    </div>
    <div class="flex items-center gap-3">
        <input type="range" min="10" max="100" step="5"
               :value="inferenceThrottlePercent"
               @input="queueInferenceThrottleUpdate($event.target.value)"
               @change="flushInferenceThrottleUpdate()"
               @keyup="flushInferenceThrottleUpdate()"
               :aria-label="window.t('settings.inference_throttle.label')"
               class="w-full accent-neutral-900">
        <span class="w-12 text-right text-sm tabular-nums text-neutral-600"
              x-text="inferenceThrottlePercent + '%'">100%</span>
    </div>
    <p class="text-xs text-neutral-400">{{ t('settings.inference_throttle.hint') }}</p>
    <p x-show="inferenceThrottleError" x-cloak role="alert"
       x-text="inferenceThrottleError" class="text-xs text-red-600"></p>
</div>
